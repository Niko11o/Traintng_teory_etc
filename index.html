<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/index.css">
</head>
<body>
    <div class="page">
        <header class="header">
            <img src="logo.png" alt="" class="logo logo_header">

            <nav class="nav nav_header nav_active">
                <a class="nav__link" href="">About</a>
                <a class="nav__link" href="">Services</a>
                <a class="nav__link" href="">Use Cases</a>
                <a class="nav__link" href="">Pricing</a>
                <a class="nav__link" href="">Blog</a>
            </nav>

            <button class="btn btn_header btn_outline">Request a quote</button>

            <div class="menu">
                <img class="menu__icon" src="menu.png" alt="">
            </div>
        </header>


        <section class="section section_first">
            <div class="section_container">
                <h1>Navigating the digital landscape for success </h1>
                <img src="/assets/img/Illustration.svg" alt="" class="section__img" />
                <p>Our digital marketing agency helps businesses grow and 
                    succeed online through a range of services including SEO, 
                    PPC, social media marketing, and content creation.</p>
                <button class="btn btn_primary"> Book a consultation</button>
            </div>
            <div class="partners">
                <img src="/assets/icons/Companylogo.svg" alt="">
                <img src="/assets/icons/Companylogo-1.svg" alt="">
                <img src="/assets/icons/Companylogo-2.svg" alt="">
                <img src="/assets/icons/Companylogo-3.svg" alt="">
                <img src="/assets/icons/Companylogo-4.svg" alt="">
                <img src="/assets/icons/Companylogo-5.svg" alt="">
            </div>
        </section>

        <section class="section section_second">
            <div class="section__header">
                <h2 class="heading heading_bg_green"></h2>
                <p></p>
            </div>
            <div class="section__cards">
                <div class="card card_service">
                    <h3 class="heading heading_bg_green">
                        <span>Search engine</span>
                        <span>optimization</span>
                    </h3>
                    <a href="" class="link link_round link_icon_green">
                        <span class="link__decor">
                            <svg class="link__icon">
                                <use xlink:href="/assets/icons/sprite.svg#arrow" />
                            </svg>
                        </span>
                        <span class="link__text">Learn more</span>
                    </a>
                    <img src="/assets/img/tokyo-magnifier-web-search-with-elements2.png" srcset="/assets/img/tokyo-magnifier-web-search-with-elements 2@2x.png 2x" alt="" class="card__img">
                </div>
            </div>
            <div class="card card_proposal"></div>
        </section>
    </div>
</body>
</html>
